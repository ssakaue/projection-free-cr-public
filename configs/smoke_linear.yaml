experiment:
  name: smoke_linear
  horizon: 300
  seeds: [0, 1, 2]
  progress_every: 100

normalization:
  enabled: true
  policy: set_level
  target_action_residual_l2: 1.0
  target_context_l2: 1.0

dataset:
  model_type: linear_contextual
  action_dim: 10
  context_dim: 10
  m_select: 5
  context_norm: 1.0
  linear:
    true_weight_norm: 1.0

learners:
  corectron:
    enabled: true
    lambda_reg: null

  ons:
    enabled: true
    domain_radius: 1.0
    ons_lr: 2.0
    epsilon: null
    proj_tol: 1.0e-10

  ogd:
    enabled: true
    domain_radius: 1.0
    step0: null
    schedule: constant

runtime:
  save_round_metrics: true
